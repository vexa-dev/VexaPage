name: Deploy to GitHub Pages

on:
  # Ejecutar en pushes a la rama principal
  push:
    branches: ["main"]
  # Permite correr este workflow manualmente desde la pestaña Actions
  workflow_dispatch:

# Permisos necesarios para publicar en gh-pages
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build (React + TypeScript)
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: vexa.space
          force_orphan: true
